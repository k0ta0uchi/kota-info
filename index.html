  let t = null;
  try { t = localStorage.getItem('kota-info-theme'); } catch (e) {}
  if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyTheme(t);
})();
function renderDetails(details) {
  if (!details) return '';
  let items = details;
  if (typeof items === 'string') { try { items = JSON.parse(items); } catch (e) { items = [items]; } }
  if (!Array.isArray(items) || items.length === 0) return '';
  const lis = items.map(d => {
    if (typeof d === 'string') return '<li>' + esc(d) + '</li>';
    const parts = [];
    const name = d.name || d.title || d.product || d.item || '';
    if (name) parts.push('<span class="d-name">' + esc(name) + '</span>');
    const deal = d.deal || d.discount || d.offer || d.description || d.text || '';
    if (deal) parts.push(esc(deal));
    if (d.price) parts.push(esc(d.price));
    if (d.code) parts.push('コード <span class="d-code">' + esc(d.code) + '</span>');
    if (d.ends || d.deadline || d.until) parts.push('〜' + esc(d.ends || d.deadline || d.until));
    if (d.condition || d.conditions) parts.push('（' + esc(d.condition || d.conditions) + '）');
    return '<li>' + parts.join(' ') + '</li>';
  }).join('');
  return '<ul class="details">' + lis + '</ul>';
}
const ARTICLES = JSON.parse(document.getElementById('data-articles').textContent);
const SALES = JSON.parse(document.getElementById('data-sales').textContent);
const ITAD = JSON.parse(document.getElementById('data-itad').textContent);
const NOW = new Date('2026-10-24T10:37:16.085851+00:00');
let mabiCat = '', saleCat = '';
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function esc(s) { const e = document.createElement('div'); e.textContent = s == null ? '' : String(s); return e.innerHTML; }
function showTab(which) {
  document.getElementById('sec-mabi').classList.toggle('hidden', which !== 'mabi');
  document.getElementById('sec-sale').classList.toggle('hidden', which !== 'sale');
  const tm = document.getElementById('tab-mabi'), ts = document.getElementById('tab-sale');
  tm.className = 'tab' + (which === 'mabi' ? ' active-mabi' : '');
  ts.className = 'tab' + (which === 'sale' ? ' active-sale' : '');
  document.getElementById('now-label').textContent = which === 'mabi' ? 'いま見ているのは 🎮 マビノギモバイル最新情報 です' : 'いま見ているのは 🏷️ セールまとめ です';
  location.hash = which;
}
function chips(elId, values, current, cb) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'chip' + (current === '' ? ' on' : ''); all.textContent = 'すべて';
  all.onclick = () => cb(''); el.appendChild(all);
  values.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chip' + (current === v ? ' on' : ''); b.textContent = v;
    b.onclick = () => cb(v); el.appendChild(b);
  });
}
function renderMabi() {
  const q = document.getElementById('mabi-q').value.toLowerCase();
  const type = document.getElementById('mabi-type').value;
  const cats = [...new Set(ARTICLES.map(a => a.category).filter(Boolean))];
  chips('mabi-cats', cats, mabiCat, v => { mabiCat = v; renderMabi(); });
  const list = ARTICLES.filter(a =>
    (mabiCat === '' || a.category === mabiCat) &&
    (type === '' || a.source_type === type) &&
    (q === '' || (a.title + ' ' + (a.summary || '')).toLowerCase().includes(q)));
  document.getElementById('mabi-count').textContent = list.length + ' 件';
  document.getElementById('mabi-list').innerHTML = list.map(a =>
    '<article class="card"><div class="meta">' +
    (a.category ? '<span class="badge">' + esc(a.category) + '</span>' : '') +
    '<span>' + esc(a.source_name || '') + '</span>' +
    (a.region_basis ? '<span>' + esc(a.region_basis) + '</span>' : '') +
    '<span>' + fmtDate(a.published_at || a.fetched_at) + '</span></div>' +
    '<h3><a href="' + esc(a.source_url) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a></h3>' +
    '<p class="summary">' + esc(a.summary || '') + '</p></article>').join('');
}
function renderSales() {
  const q = document.getElementById('sale-q').value.toLowerCase();
  const sender = document.getElementById('sale-sender').value;
  const sort = document.getElementById('sale-sort').value;
  const cats = [...new Set(SALES.map(s => s.category).filter(Boolean))];
  chips('sale-cats', cats, saleCat, v => { saleCat = v; renderSales(); });
  let list = SALES.filter(s =>
    (saleCat === '' || s.category === saleCat) &&
    (sender === '' || s.sender === sender) &&
    (q === '' || (s.subject + ' ' + (s.summary || '') + ' ' + s.sender).toLowerCase().includes(q)));
  if (sort === 'discount') list.sort((a, b) => (b.discount_pct || 0) - (a.discount_pct || 0));
  else if (sort === 'ending') list.sort((a, b) => (a.ends_at ? new Date(a.ends_at) : new Date('2999-01-01')) - (b.ends_at ? new Date(b.ends_at) : new Date('2999-01-01')));
  else list.sort((a, b) => new Date(b.received_at) - new Date(a.received_at));
  document.getElementById('sale-count').textContent = list.length + ' 件';
  document.getElementById('sale-list').innerHTML = list.map(s => {
    const ended = s.ends_at && new Date(s.ends_at) < NOW;
    return '<article class="card"><div class="meta">' +
      (s.category ? '<span class="badge">' + esc(s.category) + '</span>' : '') +
      '<span>' + esc(s.sender) + '</span><span>' + fmtDate(s.received_at) + '</span>' +
      (s.highlight ? '<span class="badge hl">' + esc(s.highlight) + '</span>' : '') +
      (s.discount_pct ? '<span class="badge off">' + s.discount_pct + '% OFF</span>' : '') +
      (ended ? '<span class="badge end">終了</span>' : (s.ends_at ? '<span>〜' + fmtDate(s.ends_at) + 'まで</span>' : '')) +
      '</div><h3>' + esc(s.subject) + '</h3>' +
      '<p class="summary">' + esc(s.summary || '') + '</p>' + renderDetails(s.details) + '</article>';
  }).join('');
  const ib = document.getElementById('itad-box');
  if (ITAD && ITAD.count > 0) {
    ib.innerHTML = '<div class="itad"><h3>IsThereAnyDeal 通知まとめ（全' + ITAD.count + '件・最新' + ITAD.items.length + '件を表示）</h3><ul>' +
      ITAD.items.map(i => '<li>' + esc(i.subject) + ' <span style="color:#888">(' + fmtDate(i.received_at) + ')</span></li>').join('') + '</ul></div>';
  } else ib.innerHTML = '';
}
(function init() {
  const types = [...new Set(ARTICLES.map(a => a.source_type).filter(Boolean))];
  const tsel = document.getElementById('mabi-type');
  types.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; tsel.appendChild(o); });
  const senders = [...new Set(SALES.map(s => s.sender).filter(Boolean))].sort();
  const ssel = document.getElementById('sale-sender');
  senders.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; ssel.appendChild(o); });
  renderMabi(); renderSales();
  showTab(location.hash === '#sale' ? 'sale' : 'mabi');
})();
</script>
</body>
</html>
